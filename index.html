<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#06060d"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><title>Case File: Fitness Detective</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#06060d;--ink:#e9edf5;--txt:#e9edf5;--mute:#8d97aa;--red:#ff5d6c;--brass:#9b8cff;--ok:#3ddc97;--cyan:#22e4ff;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--txt);font-family:'Plus Jakarta Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;background:radial-gradient(900px 500px at 85% -10%,rgba(76,201,240,.16),transparent 60%),radial-gradient(800px 500px at -10% 20%,rgba(139,123,255,.13),transparent 60%),var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:radial-gradient(circle 200px at var(--mx,50%) var(--my,25%),rgba(139,123,255,.08),transparent),radial-gradient(circle 340px at var(--mx,50%) var(--my,25%),transparent 0,rgba(3,5,10,.4) 100%)}
h1,h2,h3,.tw{font-family:'Sora',system-ui,sans-serif;font-weight:400}
h2{font-size:24px;margin:0 0 12px}
.wrap{max-width:880px;margin:0 auto;padding:18px}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn{background:linear-gradient(135deg,#b4a7ff,#6a4cff);color:#ffffff;border:0;padding:10px 20px;border-radius:999px;font-weight:700;box-shadow:0 6px 20px rgba(106,76,255,.28);transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(106,76,255,.45)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--brass);box-shadow:none}
input,select{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);padding:10px 12px;border-radius:12px;width:100%;transition:border-color .2s,background .2s}
input:focus{border-color:var(--brass);background:rgba(255,255,255,.1)}
input[type=checkbox]{accent-color:var(--ok)}
label{display:block;margin:12px 0 4px;font-size:14px;color:var(--mute)}
.folder{background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.note{font-size:14px;color:var(--mute)}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);padding:2px 12px;border-radius:6px;transform:rotate(-6deg);font-family:'JetBrains Mono',ui-monospace,monospace}
.stamp.ok{border-color:var(--ok);color:var(--ok)}
#login{max-width:450px;margin:5vh auto 0}
#login h1{font-size:36px;margin:6px 0;line-height:1.1;background:linear-gradient(90deg,#fff,var(--brass));-webkit-background-clip:text;background-clip:text;color:transparent}
.lens{font-size:54px;display:inline-block;margin-left:14px;animation:flo 3s ease-in-out infinite}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top h1{margin:0;font-size:26px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip,.badge{border:1px solid var(--line);background:var(--glass);padding:5px 14px;border-radius:999px;font-size:14px}
.badge{color:var(--brass);border-color:rgba(139,123,255,.5);font-family:'JetBrains Mono',ui-monospace,monospace}
.tabs{display:flex;gap:6px;margin:6px 0 14px;overflow-x:auto;padding-bottom:4px}
.tab{background:var(--glass);color:var(--mute);border:1px solid var(--line);padding:9px 18px;border-radius:999px;white-space:nowrap;transition:all .25s}
.tab:hover{color:var(--ink)}
.tab[aria-selected=true]{background:linear-gradient(135deg,#b4a7ff,#6a4cff);color:#ffffff;border-color:transparent;font-weight:700;box-shadow:0 6px 18px rgba(106,76,255,.3)}
.enter{animation:enter .5s cubic-bezier(.2,.8,.2,1)}
.rings{display:flex;gap:18px;justify-content:space-around;flex-wrap:wrap;margin:6px 0 18px}
.rw{display:flex;align-items:center;gap:10px;font-size:15px}
.rw small{color:var(--mute)}
.ring .bg,.rw .bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:9}
.rw .p{fill:none;stroke-width:9;stroke-linecap:round;stroke-dashoffset:var(--o);animation:rg 1.2s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px currentColor)}
.rt{fill:var(--ink);font:700 26px 'Plus Jakarta Sans',sans-serif}
.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
@media(max-width:640px){.row{grid-template-columns:1fr 1fr}.row>*:first-child{grid-column:1/-1}}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);animation:slide .35s both}
.item .g{flex:1}
.item.done .g{opacity:.55;text-decoration:line-through;text-decoration-color:var(--ok);text-decoration-thickness:2px}
.x{background:none;border:0;color:var(--red);font-size:22px;transition:transform .2s}
.x:hover{transform:rotate(90deg)}
.stats{display:flex;gap:22px;flex-wrap:wrap;margin:6px 0 12px}
.stats b{font-size:32px;font-weight:700;display:block;line-height:1.1;color:var(--brass)}
.hours{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:10px 0}
.hr{text-align:center;padding:6px 0;font-size:14px;border-radius:10px;border:1px solid var(--line);color:var(--mute)}
.hr.y{background:linear-gradient(135deg,#4cc9f0,#2b7fd6);color:#04121c;border-color:transparent;font-weight:700}
.hr.n{background:rgba(255,93,108,.14);border-color:rgba(255,93,108,.5);color:var(--red)}
.alert{background:linear-gradient(90deg,#ff5d6c,#d63a52);color:#fff;padding:10px 16px;border-radius:14px;margin-bottom:12px;font-weight:700;animation:pulse 1.8s infinite}
.glasses{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.gl{width:28px;height:40px;border:2px solid var(--mute);border-radius:4px 4px 12px 12px}
.gl.f{background:linear-gradient(#4cc9f0,#2b7fd6);border-color:var(--cyan);transform-origin:bottom;animation:fillup .7s cubic-bezier(.2,.8,.2,1)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;margin-top:14px}
.d{text-align:center;padding:8px 0;font-size:14px;font-weight:700;border-radius:12px;border:1px solid var(--line);animation:pop .45s both;animation-delay:calc(var(--i)*22ms)}
.d.s{background:linear-gradient(135deg,#3ddc97,#1fa56f);color:#032014;border-color:transparent}
.d.f{background:rgba(255,93,108,.2);border-color:var(--red);color:var(--red)}
.d.t{border:2px solid var(--brass);box-shadow:0 0 14px rgba(139,123,255,.6)}
.d.u{opacity:.45}
.bar{height:12px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--cyan));border-radius:6px;animation:grow 1.2s cubic-bezier(.2,.8,.2,1)}
svg{max-width:100%}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.98)}}
@keyframes rg{from{stroke-dashoffset:var(--c)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
@keyframes fillup{from{transform:scaleY(0)}}
@keyframes grow{from{width:0}}
@keyframes flo{50%{transform:translateY(-8px) rotate(-8deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,93,108,.25)}}
@keyframes st{from{transform:rotate(-6deg) scale(2.6);opacity:0}}
.stamp{animation:st .5s cubic-bezier(.3,1.6,.5,1)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

textarea{width:100%;min-height:130px;background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical;font:inherit}
textarea:focus{border-color:var(--brass);outline:none}
.who{display:flex;align-items:center;gap:12px}
.av{width:var(--s,46px);height:var(--s,46px);border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--brass),#4a35c9);display:grid;place-items:center;font-weight:700;color:#ffffff;border:2px solid var(--brass);font-size:calc(var(--s,46px)*.45);flex:none}
.brief{font-family:'JetBrains Mono',ui-monospace,monospace;color:var(--brass);overflow:hidden;white-space:nowrap;max-width:100%;width:0;border-right:2px solid var(--brass);margin:0 0 14px;animation:type 2.2s steps(var(--n)) .2s forwards,blink .8s step-end infinite}
.stake{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;margin-bottom:14px;border:1px dashed var(--line);border-radius:16px}
.clock{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:38px;color:var(--cyan);text-shadow:0 0 14px rgba(76,201,240,.6);min-width:110px}
.btn.on{background:linear-gradient(135deg,#ff8a95,#ff5d6c);color:#fff;animation:pulse 1.6s infinite}
.idcard{position:relative;overflow:hidden;display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:20px;border-radius:22px;border:1px solid rgba(139,123,255,.55);background:linear-gradient(135deg,rgba(139,123,255,.14),rgba(76,201,240,.08));margin-bottom:16px}
.idcard::after{content:"";position:absolute;left:0;right:0;height:70px;top:-70px;background:linear-gradient(transparent,rgba(76,201,240,.2),transparent);animation:scan 3.6s linear infinite;pointer-events:none}
.idcard h3{font-size:26px;margin:0}
.idn{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:30px;letter-spacing:.14em;color:var(--brass);text-shadow:0 0 16px rgba(139,123,255,.5)}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0 18px}
.medal{padding:14px 10px;text-align:center;border:1px solid rgba(139,123,255,.5);border-radius:18px;background:var(--glass);animation:pop .45s both;animation-delay:calc(var(--i)*70ms)}
.medal .e{font-size:34px;display:block}
.medal b{display:block;font-size:15px}
.medal small{color:var(--mute);font-size:12px}
.medal.lock{filter:grayscale(1);opacity:.4;border-color:var(--line)}
.wk{display:flex;gap:10px;align-items:flex-end;height:140px;margin:8px 0 18px}
.wk .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mute);gap:3px}
.wk i{display:block;width:100%;border-radius:8px 8px 3px 3px;background:linear-gradient(var(--brass),#6a4cff);transform-origin:bottom;animation:grow2 .8s both;animation-delay:calc(var(--i)*70ms)}
.entry{position:relative;padding:12px 16px;border-left:3px solid var(--brass);background:var(--glass);border-radius:4px 14px 14px 4px;margin-top:10px;animation:slide .35s both}
.entry p{margin:4px 0 0}
.pf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
@keyframes type{to{width:calc(var(--n)*1ch)}}
@keyframes blink{50%{border-color:transparent}}
@keyframes grow2{from{transform:scaleY(0)}}
@keyframes scan{to{top:100%}}
h1,h2,h3{letter-spacing:-.02em;font-weight:700}
.stats b,.rt{font-family:'Sora',sans-serif}
.tab,.btn{letter-spacing:.01em}
.brief{font-size:15px}
.cl{display:flex;flex-direction:column;gap:10px;max-height:380px;overflow-y:auto;padding:4px;margin-bottom:12px}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;animation:slide .3s both}
.msg.a{background:var(--glass);border:1px solid var(--line);border-bottom-left-radius:4px;align-self:flex-start}
.msg.u{background:linear-gradient(135deg,#b4a7ff,#6a4cff);color:#ffffff;border-bottom-right-radius:4px;align-self:flex-end}
.sug{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.send{display:flex;gap:8px}
button.chip{color:var(--ink);cursor:pointer;font:inherit;font-size:14px;transition:border-color .2s}
button.chip:hover{border-color:var(--brass)}
.dots::after{content:"";animation:dt 1.2s steps(4) infinite}
@keyframes dt{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;filter:blur(30px);background:radial-gradient(circle at 20% 30%,rgba(139,123,255,.2),transparent 40%),radial-gradient(circle at 80% 20%,rgba(76,201,240,.2),transparent 40%),radial-gradient(circle at 60% 85%,rgba(255,93,108,.14),transparent 40%);animation:aur 16s ease-in-out infinite alternate}
.cf{position:fixed;top:-16px;width:9px;height:15px;z-index:50;pointer-events:none;border-radius:2px;animation:cf 2s ease-in forwards}
.shake{animation:shake .4s}
.lockc{text-align:left}
.folder{transition:transform .3s,box-shadow .3s}
.tab:active{transform:scale(.95)}
@keyframes aur{to{transform:translate(4%,3%) rotate(8deg) scale(1.12)}}
@keyframes cf{to{transform:translate(var(--dx),108vh) rotate(720deg)}}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

.wrap{padding-bottom:130px}
.btn{background:linear-gradient(180deg,#9a87ff,#6a4cff);color:#fff;box-shadow:0 6px 0 #3b25b5,0 14px 26px rgba(106,76,255,.45),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 0 #3b25b5,0 18px 30px rgba(106,76,255,.55),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #3b25b5,0 4px 10px rgba(106,76,255,.4)}
.btn.on{background:linear-gradient(180deg,#ff8a95,#ff4d6d);box-shadow:0 6px 0 #a3203a,0 14px 26px rgba(255,77,109,.4)}
.btn.ghost,.btn.ghost:hover,.btn.ghost:active{background:transparent;box-shadow:none;transform:none;color:var(--ink)}
.folder{box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 30px 80px rgba(0,0,0,.55)}
.tabs{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:20;margin:0;padding:8px;gap:2px;max-width:calc(100vw - 16px);background:rgba(16,14,32,.74);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:28px;box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12)}
.tab{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 9px;border-radius:20px;background:transparent;border:0;color:var(--mute);min-width:52px;box-shadow:none}
.tab .ic{font-size:22px;line-height:1.2;transition:transform .25s cubic-bezier(.3,1.6,.5,1);filter:grayscale(.7)}
.tab .lb{font-size:10px;font-weight:700}
.tab:hover .ic{transform:translateY(-4px) scale(1.2)}
.tab[aria-selected=true]{background:linear-gradient(180deg,rgba(154,135,255,.38),rgba(106,76,255,.22));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 18px rgba(139,123,255,.5)}
.tab[aria-selected=true] .ic{transform:translateY(-3px) scale(1.18);filter:none}
.orb{position:fixed;border-radius:50%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.85),var(--c) 35%,rgba(0,0,0,.65) 100%);box-shadow:0 30px 60px rgba(0,0,0,.5),inset -12px -16px 30px rgba(0,0,0,.45);opacity:.8;animation:orb 9s ease-in-out infinite alternate;translate:calc(var(--px,0)*var(--d)*1px) calc(var(--py,0)*var(--d)*1px)}
.scene{perspective:700px;display:flex;justify-content:center;margin:10px 0 22px}
.cube{width:90px;height:90px;position:relative;transform-style:preserve-3d;animation:spin 10s linear infinite}
.cube em{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-style:normal;background:rgba(139,123,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:14px;box-shadow:inset 0 0 26px rgba(139,123,255,.5)}
.f1{transform:translateZ(45px)}.f2{transform:rotateY(90deg) translateZ(45px)}.f3{transform:rotateY(180deg) translateZ(45px)}.f4{transform:rotateY(-90deg) translateZ(45px)}.f5{transform:rotateX(90deg) translateZ(45px)}.f6{transform:rotateX(-90deg) translateZ(45px)}
.idcard,.medal,.stake,.bmiCard,.fc,#login{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .15s}
.idcard{background:linear-gradient(135deg,rgba(139,123,255,.28),rgba(34,228,255,.12),rgba(255,79,216,.16));border-color:rgba(139,123,255,.6)}
.lockc .av{box-shadow:0 0 0 6px rgba(139,123,255,.25),0 0 40px rgba(139,123,255,.6);animation:ring 2.4s ease-in-out infinite}
.str{height:6px;background:rgba(255,255,255,.1);border-radius:4px;margin:6px 0 2px;overflow:hidden}
.str i{display:block;height:100%;width:0;transition:width .3s,background .3s}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0 0}
.xp{height:12px;background:rgba(255,255,255,.1);border-radius:8px;overflow:hidden;margin-top:12px}
.xp i{display:block;height:100%;background:linear-gradient(90deg,#8b7bff,#22e4ff,#ff4fd8,#8b7bff);background-size:200%;animation:grow 1.2s both,shine 3s linear infinite}
.gz{display:block;margin:6px auto;max-width:340px;width:100%}
.bnum{font:700 64px/1 'Sora',sans-serif;text-align:center;text-shadow:0 0 30px currentColor;margin-top:4px}
.blv{display:block;width:max-content;margin:10px auto;padding:4px 18px;border-radius:999px;color:#06060d;font-weight:700}
.lvls{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lv{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--c);color:var(--c);opacity:.6;transition:transform .3s}
.lv.now{opacity:1;background:var(--c);color:#06060d;font-weight:700;box-shadow:0 0 18px var(--c);transform:scale(1.08)}
@keyframes orb{to{transform:translateY(-28px) scale(1.06)}}
@keyframes spin{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(-20deg) rotateY(360deg)}}
@keyframes ring{50%{box-shadow:0 0 0 14px rgba(139,123,255,.08),0 0 60px rgba(139,123,255,.85)}}
@keyframes shine{to{background-position:200% 0}}
@keyframes fade{from{opacity:0}}

.ico{display:block;flex:none}
.tab .ic{display:flex;filter:none}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip .ico{color:#ffb347}
.medal .e{display:grid;place-items:center;color:#a99bff;margin-bottom:6px;font-size:0}
.medal.lock .e{color:var(--mute)}
.cube em{color:#fff}
.hero{text-align:center;padding:10px 0 8px}
.tag{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border:1px solid var(--line);border-radius:999px;background:var(--glass);font-size:13px;animation:slide .5s both}
.tag .ico{color:var(--ok)}
.hero h1{font-size:clamp(32px,8vw,58px);line-height:1.05;margin:8px 0 14px;animation:enter .7s both}
.gt{background:linear-gradient(90deg,#9a87ff,#22e4ff,#ff4fd8,#9a87ff);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
.sub{max-width:560px;margin:0 auto 24px;color:var(--mute);font-size:17px}
.btn.big{padding:14px 30px;font-size:17px;display:inline-flex;align-items:center;gap:10px}
.sh{text-align:center;margin:40px 0 16px;font-size:26px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fc{padding:18px;border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:pop .5s both;animation-delay:calc(var(--i)*70ms)}
.fc h3{margin:14px 0 4px;font-size:18px}
.fc p{margin:0;color:var(--mute);font-size:14px}
.ib{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#a99bff,#5b3df5);box-shadow:0 6px 0 -1px #2f1c96,0 14px 24px rgba(106,76,255,.4),inset 0 1px 0 rgba(255,255,255,.45)}
.steps{display:grid;gap:12px}
.st{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:18px;background:var(--glass);border:1px solid var(--line);animation:slide .5s both;animation-delay:calc(var(--i)*120ms)}
.sn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 16px 'Sora',sans-serif;background:linear-gradient(145deg,#22e4ff,#6a4cff);color:#fff}

<script>

 (tab!=='today'?'<button class="backbtn" onclick="goBack()">'+ico('back',16)+' Back</button>':'')+'<div class="folder panel'+(anim?' enter':'')+'">'+({today:todayHTML,water:waterHTML,weight:weightHTML,mission:missionHTML,notes:notesHTML,coach:coachHTML,bmi:bmiHTML,profile:profileHTML}[tab])()+'</div>'+

 '<label>Name</label><input id="n" autocomplete="name">'+
 '<label>Gmail address</label><input id="e" type="email" placeholder="you@gmail.com" autocomplete="email">'+
 '<label>Phone number</label><input id="p" type="tel" autocomplete="tel">'+
 '<label>Age</label><input id="a" type="number" min="5" max="110">'+'<label>Create a password (6+ characters)</label><input id="pw1" type="password" autocomplete="new-password" oninput="stre(this)"><div class="str"><i id="sb"></i></div><small class="note" id="sl"></small><label class="chk"><input type="checkbox" onchange="showpw(this)" style="width:auto"> Show passwords</label><label>Repeat password</label><input id="pw2" type="password" autocomplete="new-password">'+
 '<p id="err" style="color:var(--red);min-height:1.4em;margin:8px 0"></p>'+

 if(er){document.getElementById('err').textContent=er;return}

<script>

 if(!m||m.editing)return '<h2>New mission</h2><label>Mission name</label><input id="mn" value="'+esc(m?m.name:'Operation 30 Days')+'"><label>How many days?</label><input id="md" type="number" min="1" max="365" value="'+(m?m.days:30)+'"><label>Exercise minutes needed each day</label><input id="mm" type="number" min="1" value="'+(m?m.min:30)+'"><label>Glasses of water needed each day</label><input id="mg" type="number" min="1" value="'+(m?m.gl:8)+'"><p style="margin-top:14px"><button class="btn" onclick="startM()">Start mission today</button></p><p class="note">A day is solved when you reach both targets. Anything less is a cold case.</p>';

function landHTML(){return '<div class="hero"><div class="tag">'+ico('shield',16)+' Private, free and on your device</div>'+cube()+'<h1>Solve the case of a <span class="gt">fitter you</span></h1><p class="sub">Fitness Detective Agency turns your daily workouts, water, weight and goals into a case file. Log the evidence every day and close the mission.</p><button class="btn big" onclick="start()">Open your case file '+ico('arrow',18)+'</button></div>'+
 '<h2 class="sh">What is inside</h2><div class="fg">'+FEAT.map(function(f,i){return '<div class="fc" style="--i:'+i+'"><div class="ib">'+ico(f[0],24)+'</div><h3>'+f[1]+'</h3><p>'+f[2]+'</p></div>'}).join('')+'</div>'+
 '<h2 class="sh">How it works</h2><div class="steps">'+STEPS.map(function(t,i){return '<div class="st" style="--i:'+i+'"><div class="sn">'+(i+1)+'</div><div><b>'+t[0]+'</b><span>'+t[1]+'</span></div></div>'}).join('')+'</div>'+
 '<div class="folder" style="margin-top:28px;text-align:center"><h3>Ready, detective?</h3><p class="note">Your logs, profile and password lock stay on this device. The AI Coach works only inside claude.ai and sends your chat and a summary of your logs to Claude to answer you.</p><button class="btn big" onclick="start()">Start now '+ico('arrow',18)+'</button></div>'}

var LIB=[['Pushups','dumbbell',5,10,20],['Squats','dumbbell',5,15,25],['Sit-ups','dumbbell',5,15,30],['Lunges','dumbbell',5,10,20],['Plank','timer',3,0,0],['Yoga stretch','target',15,0,0],['Running','flame',20,0,0],['Walking','flame',30,0,0],['Cycling','flame',20,0,0],['Skipping rope','flame',10,0,0],['Jumping jacks','flame',5,30,60],['Burpees','flame',5,8,15]];
function libHTML(){return '<h3 style="margin:4px 0 0;font-size:16px">Quick add workouts</h3><p class="note" style="margin:2px 0 6px">Tap a workout to add it to today. You can tick it done below.</p><div class="lib">'+LIB.map(function(x,i){return '<button class="chip" onclick="qadd('+i+')">'+ico(x[1],16)+' '+x[0]+' <small>'+x[2]+' min</small></button>'}).join('')+'</div>'}
function qadd(i){var x=LIB[i];log(today()).ex.push({n:x[0],min:x[2],a:x[3],b:x[4],done:false});save();render()}

var PREV='today',TABS=['today','water','weight','mission','notes','coach','bmi','profile'];
function goBack(){go(PREV&&PREV!==tab?PREV:'today')}
addEventListener('hashchange',function(){var h=location.hash.slice(1);
 if(h==='welcome'||h==='join'){var l=h==='welcome';if(LAND!==l){LAND=l;render(true)}return}
 var t=h===''?'today':h;if(TABS.indexOf(t)>-1&&t!==tab){PREV=tab;tab=t;render(true)}});
(function(){var h=location.hash.slice(1);if(TABS.indexOf(h)>-1)tab=h;else if(h==='join')LAND=false})();
render(true);
